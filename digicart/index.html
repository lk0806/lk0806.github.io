<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiCart India | Loading...</title>
  <script>
    // Intelligent Decoupled Router for digicartcartindia.shop
    (function() {
      var params = new URLSearchParams(window.location.search);
      var path = window.location.pathname.toLowerCase();
      var hash = window.location.hash.toLowerCase();

      // If user came via digital campaign, digital query, or digital path
      if (params.get('view') === 'digital' || params.get('ref') === 'digital' || hash === '#digital' || path.indexOf('digital') !== -1) {
        window.location.replace('digital.html');
      } else {
        // Default flagship destination for all gifting and general traffic
        window.location.replace('magic-mirror.html');
      }
    })();
  </script>
</head>
<body style="background:#0a0b10; color:#fff; font-family:sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <div style="text-align:center;">
    <p style="font-size:1.2rem; color:#94a3b8;">Redirecting to your exclusive shopping experience...</p>
  </div>
</body>
</html>

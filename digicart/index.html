<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiCart Live Store Gateway</title>
  <meta http-equiv="refresh" content="0; url=https://screenshots-produced-logical-currency.trycloudflare.com/">
  <link rel="canonical" href="https://screenshots-produced-logical-currency.trycloudflare.com/">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      max-width: 440px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border-left-color: #38bdf8;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; font-size: 0.875rem; color: #94a3b8; line-height: 1.5; }
    a.btn {
      display: inline-block;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      font-size: 0.875rem;
      transition: opacity 0.2s;
    }
    a.btn:hover { opacity: 0.9; }
  </style>
  <script>
    (function() {
      var baseTarget = "https://screenshots-produced-logical-currency.trycloudflare.com";
      var query = window.location.search || "";
      var hash = window.location.hash || "";
      
      fetch("../gateway.json?t=" + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var active = (d.digicart_url || d.active_tunnel_url || d.live_url || baseTarget).replace(/\/+$/, "");
          window.location.replace(active + "/" + query + hash);
        })
        .catch(function() {
          window.location.replace(baseTarget + "/" + query + hash);
        });
    })();
  </script>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to DigiCart Live Store</h2>
    <p>Connecting to secure live origin tunnel...</p>
    <a class="btn" href="https://screenshots-produced-logical-currency.trycloudflare.com/">Enter DigiCart Store Now</a>
  </div>
</body>
</html>

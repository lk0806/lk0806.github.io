<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lalit Remote Workstation & JARVIS OS</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070d19; }
    #viewport-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      border: none;
      outline: none;
      z-index: 10;
      background: #070d19;
    }
    #loading-splash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #070d19;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #38bdf8;
    }
    .pulse-ring { width: 44px; height: 44px; border: 3px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="pulse-ring"></div>
    <div style="font-weight: 600; font-size: 0.9rem; letter-spacing: 0.05em; color: #94a3b8;">CONNECTING TO WORKSTATION...</div>
  </div>

  <iframe
    id="viewport-frame"
    allow="microphone; camera; autoplay; display-capture; clipboard-read; clipboard-write; fullscreen"
    style="display:none;"
  ></iframe>

  <script>
    (function() {
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^\/]+)(\/.*)?$/);
      var sub = "";
      if (repoMatch && repoMatch[2]) {
        sub = repoMatch[2];
      } else if (path !== "/" && path !== "") {
        sub = path;
      }
      
      var gatewayJsonUrl = window.location.origin + '/gateway.json?t=' + Date.now();
      
      fetch(gatewayJsonUrl)
        .then(function(res) {
          if (!res.ok) throw new Error("Gateway JSON unavailable");
          return res.json();
        })
        .then(function(data) {
          if (data && data.live_url) {
            var destination = data.live_url.replace(/\/$/, '') + sub + window.location.search;
            var frame = document.getElementById('viewport-frame');
            frame.src = destination;
            frame.onload = function() {
              var splash = document.getElementById('loading-splash');
              if (splash) splash.style.display = 'none';
              frame.style.display = 'block';
            };
            setTimeout(function() {
              var splash = document.getElementById('loading-splash');
              if (splash) splash.style.display = 'none';
              frame.style.display = 'block';
            }, 1500);
          } else {
            document.getElementById('loading-splash').innerHTML = '<div style="color:#ef4444;font-size:0.9rem;">Workstation is currently sleeping.</div>';
          }
        })
        .catch(function(err) {
          console.warn("Retrying gateway connection...", err);
          setTimeout(function() { window.location.reload(); }, 3000);
        });
    })();
  </script>
</body>
</html>

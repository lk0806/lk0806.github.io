<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Playboy & Mind OS — 24/7 Autonomous Wingman</title>
  <link rel="icon" href="/favicon.ico">
  <meta name="theme-color" content="#070d19">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070d19; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #viewport-frame {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      border: none;
      outline: none;
      z-index: 10;
      background: #070d19;
      display: none;
    }
    #loading-splash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at top, #1e1b4b 0%, #070d19 80%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 5;
      color: #f472b6;
      text-align: center;
      padding: 20px;
    }
    .pulse-ring { width: 50px; height: 50px; border: 3px solid #ec4899; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1.2rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .status-text { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.05em; color: #f472b6; margin-bottom: 0.5rem; }
    .sub-text { font-size: 0.8rem; color: #94a3b8; max-width: 320px; line-height: 1.4; }
    .cloud-badge { margin-top: 15px; font-size: 11px; padding: 4px 12px; border-radius: 99px; background: rgba(236,72,153,0.15); border: 1px solid rgba(236,72,153,0.4); color: #fbcfe8; }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="pulse-ring"></div>
    <div class="status-text" id="status-title">CONNECTING TO PLAYBOY & MIND OS...</div>
    <div class="sub-text" id="status-desc">Connecting to live workstation or 24/7 cloud node...</div>
    <div class="cloud-badge">🔥 24/7 ZERO DOWNTIME FAILOVER ACTIVE</div>
  </div>

  <iframe
    id="viewport-frame"
    allow="microphone; camera; autoplay; display-capture; clipboard-read; clipboard-write; fullscreen"
  ></iframe>

  <script>
    (function() {
      var CLOUD_PLAYBOY_URL = "https://delta-master-shield-portal.onrender.com/playboy";
      var frame = document.getElementById('viewport-frame');
      var splash = document.getElementById('loading-splash');
      var statusDesc = document.getElementById('status-desc');

      function launch(destination, source) {
        if (statusDesc) statusDesc.innerText = "Connected to " + source + "! Loading interface...";
        frame.src = destination + window.location.search;
        frame.onload = function() {
          if (splash) splash.style.display = 'none';
          frame.style.display = 'block';
        };
        setTimeout(function() {
          if (splash) splash.style.display = 'none';
          frame.style.display = 'block';
        }, 1200);
      }

      var gatewayJsonUrl = window.location.origin + '/gateway.json?t=' + Date.now();
      
      var timeoutId = setTimeout(function() {
        console.log("Workstation response timeout. Launching 24/7 Cloud Node.");
        launch(CLOUD_PLAYBOY_URL, "24/7 Cloud Node");
      }, 3000);

      fetch(gatewayJsonUrl)
        .then(function(res) {
          if (!res.ok) throw new Error("gateway.json missing");
          return res.json();
        })
        .then(function(data) {
          var liveUrl = data.live_url || data.active_tunnel_url || data.url;
          if (!liveUrl) throw new Error("No live_url");
          
          var localTarget = liveUrl.replace(/\/$/, '') + '/playboy';
          
          var ctrl = new AbortController();
          var probeTimer = setTimeout(function() { ctrl.abort(); }, 2000);

          fetch(liveUrl.replace(/\/$/, '') + '/api/auth/status', { signal: ctrl.signal, mode: 'no-cors' })
            .then(function() {
              clearTimeout(probeTimer);
              clearTimeout(timeoutId);
              launch(localTarget, "Live Workstation");
            })
            .catch(function() {
              clearTimeout(probeTimer);
              clearTimeout(timeoutId);
              launch(CLOUD_PLAYBOY_URL, "24/7 Cloud Node");
            });
        })
        .catch(function(err) {
          clearTimeout(timeoutId);
          launch(CLOUD_PLAYBOY_URL, "24/7 Cloud Node");
        });
    })();
  </script>
</body>
</html>

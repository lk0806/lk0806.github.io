<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lalit e-Seva Point & Remote Desk Gateway</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #070d19; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; }
    .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 1.25rem; padding: 2.5rem 2rem; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 20px 35px -10px rgba(0,0,0,0.7); }
    .pulse-ring { position: relative; width: 56px; height: 56px; margin: 0 auto 1.5rem; }
    .pulse-ring div { position: absolute; width: 100%; height: 100%; border: 3px solid #38bdf8; border-radius: 50%; animation: ripple 1.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .pulse-ring div:nth-child(2) { animation-delay: -0.5s; }
    @keyframes ripple { 0% { top: 28px; left: 28px; width: 0; height: 0; opacity: 1; } 100% { top: 0px; left: 0px; width: 56px; height: 56px; opacity: 0; } }
    h1 { font-size: 1.35rem; font-weight: 700; color: #38bdf8; margin-bottom: 0.5rem; letter-spacing: -0.02em; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.5rem; }
    .status-badge { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.4rem 1rem; border-radius: 9999px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.2); font-size: 0.8rem; color: #7dd3fc; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse-ring">
      <div></div><div></div>
    </div>
    <h1>Mahor Secure Gateway</h1>
    <p id="status-text">Connecting to active cloud node...</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span id="badge-text">Encrypted End-to-End</span>
    </div>
  </div>

  <script>
    (function() {
      // Determine target subpath (e.g. /jarvis or /otp-desk)
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^\/]+)(\/.*)?$/);
      var sub = "";
      if (repoMatch && repoMatch[2]) {
        sub = repoMatch[2];
      } else if (path !== "/" && path !== "") {
        sub = path;
      }
      
      // Fetch gateway config with cache busting
      fetch('gateway.json?t=' + Date.now())
        .then(function(res) {
          if (!res.ok) throw new Error("Gateway JSON unavailable");
          return res.json();
        })
        .then(function(data) {
          if (data && data.live_url) {
            var destination = data.live_url.replace(/\/$/, '') + sub;
            document.getElementById('status-text').innerText = "Redirecting to " + (sub || "Remote Screen") + "...";
            window.location.replace(destination);
          } else {
            document.getElementById('status-text').innerText = "Host is sleeping. Please wake server.";
          }
        })
        .catch(function(err) {
          document.getElementById('status-text').innerText = "Reconnecting to gateway node...";
          setTimeout(function() { window.location.reload(); }, 2500);
        });
    })();
  </script>
</body>
</html>

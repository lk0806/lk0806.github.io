<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>JARVIS OS — 24/7 Cloud & Remote Workstation</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070d19; }
    #viewport-frame {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      width: 100%; height: 100%; border: none; outline: none;
      z-index: 10; background: #070d19; display: none;
    }
    #loading-splash {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #070d19; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #38bdf8;
    }
    .pulse-ring { width: 44px; height: 44px; border: 3px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="pulse-ring"></div>
    <div id="splash-msg" style="font-weight: 600; font-size: 0.9rem; letter-spacing: 0.05em; color: #94a3b8;">CONNECTING TO WORKSTATION / CLOUD JARVIS...</div>
  </div>
  <iframe
    id="viewport-frame"
    allow="microphone; camera; autoplay; display-capture; clipboard-read; clipboard-write; fullscreen"
  ></iframe>
  <script>
    (function() {
      var CLOUD_JARVIS = "https://delta-master-shield-portal.onrender.com/jarvis";
      var rawPath = window.location.pathname || "";
      var cleanPath = rawPath.replace(/\/+$/, "");
      var sub = (cleanPath && cleanPath !== "/") ? cleanPath : "/jarvis";
      var frame = document.getElementById("viewport-frame");
      var splash = document.getElementById("loading-splash");
      var splashMsg = document.getElementById("splash-msg");
      var loaded = false;

      function mountDest(url, label) {
        if (loaded) return;
        loaded = true;
        if (splashMsg && label) splashMsg.innerText = label;
        frame.src = url;
        frame.onload = function() {
          if (splash) splash.style.display = "none";
          frame.style.display = "block";
        };
        setTimeout(function() {
          if (splash) splash.style.display = "none";
          frame.style.display = "block";
        }, 1200);
      }

      fetch(window.location.origin + "/gateway.json?t=" + Date.now())
        .then(function(res) {
          if (!res.ok) throw new Error("Gateway JSON unavailable");
          return res.json();
        })
        .then(function(data) {
          var liveUrl = (data && (data.live_url || data.active_tunnel_url || data.url) || "").replace(/\\/$/, "");
          if (!liveUrl) throw new Error("No tunnel URL");
          var ctrl = new AbortController();
          var t = setTimeout(function() { ctrl.abort(); }, 2500);
          return fetch(liveUrl + "/healthz", { signal: ctrl.signal, mode: "cors" })
            .then(function(hr) {
              clearTimeout(t);
              if (!hr.ok) throw new Error("Tunnel unhealthy");
              return hr.json();
            })
            .then(function(hj) {
              if (!hj || !hj.ok) throw new Error("Healthcheck false");
              mountDest(liveUrl + sub + window.location.search, "LAPTOP WORKSTATION ONLINE — LAUNCHING JARVIS...");
            });
        })
        .catch(function() {
          mountDest(CLOUD_JARVIS + window.location.search, "CLOUD 24/7 JARVIS ACTIVE — CONNECTING...");
        });
    })();
  </script>
</body>
</html>
